name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    # The ratchet gate (P2 item 16): ruff for Python, eslint for JS. Both rule
    # sets are clean today and narrow on purpose — see pyproject [tool.ruff]
    # and eslint.config.mjs. The file-size ratchet itself runs inside pytest
    # (tests/test_size_ratchet.py) so it also gates local runs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Node dependencies
        run: npm ci
      - name: eslint
        run: npx eslint .
      - name: ruff
        run: |
          pip install ruff
          ruff check python sdk scripts tests conftest.py
      - name: Dependency audit
        # The actual gate the 09-07 review asked for. A comment in the
        # self-test job used to claim `npm install` without --no-audit gated
        # this; it never did — install prints advisories and exits 0. Runtime
        # exposure is what a user's install gets (bundles ship no
        # node_modules; install-*.ps1/sh run npm install on the target), so
        # prod deps gate at moderate; dev/build tooling gates at high.
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=high

  install-smoke:
    # Cross-platform install + syntax + JS-test smoke (P2 item 17). Most
    # development happens on Windows while the full self-test job below is
    # Linux-only (Postgres service containers), so without this matrix a
    # Windows- or macOS-only install breakage ships silently — exactly what
    # the P1 items 8-10 of the production-readiness review were.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Node dependencies
        run: npm ci
      - name: Renderer and main-process syntax check
        run: |
          node --check renderer/renderer.js
          node --check electron/main.js
      - name: JavaScript tests
        run: npx jest --runInBand
      - name: Install Python dependencies
        run: pip install ".[test]"
      - name: Python import smoke
        # Importing the server and the tool registry exercises every module-load
        # path (the layer where platform-specific breakage lives) without
        # needing a database.
        run: python -c "import python.harness.server, sdk.agent.tools; print('import smoke ok')"
      - name: Size ratchet
        run: python -m pytest tests/test_size_ratchet.py -q
      - name: AppContainer CreateProcess diagnostic
        if: runner.os == 'Windows'
        run: python sdk/agent/sandbox_windows_launch.py --diagnose
      - name: Sandbox isolation tests
        # Full pytest is Linux-only (Postgres). These tests are OS-specific and
        # must run here so macOS sandbox-exec and Windows AppContainer behaviour
        # is reported as SKIPPED vs EXECUTED on the matching runner.
        run: python -m pytest tests/test_sandbox.py -v --tb=short -rs

  package-smoke:
    # The distribution format is the source zips from scripts/build_bundles.py
    # (electron-builder was dropped 2026-09-23: its allowlist drifted from
    # BASE_EXCLUDES and its output was never published). Build the real
    # artifact and verify it carries the app entrypoints and none of this
    # install's live state.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build release bundles
        run: python scripts/build_bundles.py --no-version-bump
      - name: Verify the bundle carries the app entrypoints and no live state
        run: |
          python - <<'EOF'
          import zipfile
          names = set(zipfile.ZipFile('blockchain/public/tala-linux.zip').namelist())
          for f in ('electron/main.js', 'renderer/renderer.js',
                    'python/harness/server.py', 'package.json',
                    'scripts/start-tala.sh'):
              assert f in names, f'missing {f} in bundle'
          leaked = [n for n in names if n.startswith('nodes/settings-')
                    or n == 'emotion_state.json' or n.startswith('nodes/persona-')]
          assert not leaked, f'live state in bundle: {leaked}'
          print('bundle tree ok')
          EOF

  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres service containers are only supported on Linux-hosted runners,
    # which is why this job runs on ubuntu-latest rather than windows-latest
    # even though most local development on this project happens on Windows.
    services:
      postgres:
        # pgvector build of Postgres 16: the memory tables need the vector
        # extension, which the stock postgres image does not ship.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tala
          POSTGRES_PASSWORD: tala
          POSTGRES_DB: tala
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tala"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TALA_DB_URL: postgresql://tala:tala@localhost:5432/tala
      TALA_CHAIN_BIND_HOST: 127.0.0.1
      TALA_CHAIN_BIND_PORT: "8332"
      TALA_CHAIN_STANDALONE: "1"
      WS_HOST: 127.0.0.1
      WS_PORT: "8765"
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Free up disk space
        # The [transformers] extra is multi-GB. Reclaim space the hosted runner
        # spends on toolchains this job never uses (dotnet, Haskell, the Android
        # SDK) so the install cannot hit "No space left on device".
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup || true
          df -h /

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        # Installs the base runtime deps plus the [test] extra (pytest,
        # pytest-asyncio) and [transformers] extra. The transformers extra
        # gives the DAG-synthesis tests (test_graph_engine.py etc.) the same
        # local-model fallback path used in dev, since CI has no Ollama/vLLM
        # installed. First run downloads a small model from Hugging Face Hub,
        # so this job needs outbound internet access.
        #
        # torch is installed CPU-only first, from the PyTorch CPU index. Without
        # this the transformers extra resolves the default CUDA build of torch
        # and pulls multi-GB nvidia-cuda-* wheels that CI never uses on its
        # CPU-only runner -- which exhausted the disk (No space left on device).
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[test,transformers]"

      - name: Create isolated test database
        # conftest.py redirects the pytest suite onto a sibling "<db>_test"
        # database so a run never mutates the app's own data. The Postgres
        # service only creates POSTGRES_DB (tala), so create the sibling here.
        # Uses asyncpg (already installed above) rather than a psql client.
        run: |
          python - <<'PY'
          import asyncio, asyncpg
          async def main():
              conn = await asyncpg.connect("postgresql://tala:tala@localhost:5432/postgres")
              try:
                  exists = await conn.fetchval(
                      "SELECT 1 FROM pg_database WHERE datname='tala_test'")
                  if not exists:
                      await conn.execute('CREATE DATABASE tala_test OWNER tala')
                      print("created database tala_test")
                  else:
                      print("database tala_test already exists")
              finally:
                  await conn.close()
          asyncio.run(main())
          PY

      - name: Start local blockchain node (standalone)
        run: |
          nohup node blockchain/src/app.js > blockchain-node.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8332/chain/status > /dev/null; then
              echo "Blockchain node is up."
              exit 0
            fi
            sleep 1
          done
          echo "Blockchain node did not become ready in time." >&2
          cat blockchain-node.log
          exit 1

      - name: Run self-test suite
        # The dependency-security gate is the explicit `npm audit` step in the
        # lint job — an earlier comment here claimed npm install without
        # --no-audit gated advisories, but install only prints them and exits
        # 0. The js-yaml/tar (and 7 more) transitive vulnerabilities were
        # fixed via `npm audit fix` on 2026-09-12.
        run: python scripts/tala_self_test.py

      - name: Upload blockchain node log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blockchain-node-log
          path: blockchain-node.log
