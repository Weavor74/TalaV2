[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tala-engine"
version = "0.1.83"
description = "Tala Cognitive Engine Room — local AI orchestration shell"
authors = [
  { name="Tala Project" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets==16.0",
    "asyncpg==0.31.0",
    "markdown==3.10.2",
    "PyYAML==6.0.3",
    "tiktoken==0.13.0",
    "python-dotenv==1.2.2",
    "pydantic==2.13.4",
    "openai==2.44.0",
    "google-generativeai==0.8.6",
    "textual==8.2.7",
    "rich==15.0.0",
    "mcp==1.28.0",
    "click==8.4.2",
    "httpx-sse==0.4.3",
    "cryptography==49.0.0",
    "chromadb==1.5.9",
    "pyautogui==0.9.54",
    "Pillow==12.2.0",
    "pyttsx3>=2.90",
    "discord.py>=2.4",
    "playwright>=1.45",
    "mnemonic==0.21",
    "aiortc==1.14.0",
    "lxml==6.1.1",
    "tqdm>=4.66.0",
    "huggingface_hub>=0.23.0",
]

[project.optional-dependencies]
# Storage backends are optional by design. Steven: "A user may never install or
# consume any of the storage/git/database providers but they should have the
# option too." Nothing here ships by default -- a portable install carries no
# cloud SDK it will not use -- and the panel names the exact extra to install
# for a backend that is not present.
#
# folder, ftp and webdav need nothing: pathlib, ftplib and httpx cover them.
s3 = ["boto3>=1.34"]
sftp = ["paramiko>=3.4"]
azure = ["azure-storage-blob>=12.19"]
dropbox = ["dropbox>=11.36"]
gdrive = ["google-api-python-client>=2.120"]
onedrive = ["msal>=1.28"]

# User databases, same rule: optional. Postgres and SQLite need nothing --
# asyncpg is already here because Tala's own store is Postgres, and sqlite3 is
# in the standard library.
mysql = ["aiomysql>=0.2"]
mongodb = ["pymongo>=4.6"]
mssql = ["aioodbc>=0.5"]
oracle = ["oracledb>=2.0"]

test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0"
]
transformers = [
    "transformers==5.15.0",
    "accelerate==1.14.0",
    "sentencepiece==0.2.1",
]
# LoRA voice-adapter training (scripts/train_voice_adapter.py, and the JIT path
# in python/inference/lora_trainer.py).
#
# An extra rather than a base dependency deliberately: torch alone is ~2.5GB and
# Tala is meant to run from a USB stick. Everything here is only needed to TRAIN
# an adapter; applying one needs peft and transformers, which the transformers
# extra above already covers.
#
#     uv pip install -e ".[training]"
#
# torch is NOT pinned to a build here. The default index serves +cpu wheels,
# which train a 0.5B adapter perfectly well but leave an NVIDIA card idle. For
# CUDA, install torch from the matching index BEFORE this extra, or pip will
# resolve the CPU build and later CUDA installs will fight it -- a mismatch
# already paid for on this machine once.
training = [
    "peft==0.20.0",
    "trl==1.10.0",
    "datasets==5.0.1",
    "transformers==5.15.0",
    "accelerate==1.14.0",
]
vllm = [
    "vllm>=0.5.0",
]
llamacpp = [
    "llama-cpp-python>=0.2.79",
]
voice = [
    "openai-whisper>=20231117",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0,<2.5.0",
]
mem0 = [
    "mem0ai>=0.1.29",
]
astrology = [
    "pyswisseph>=2.10.3.2",
]

[project.scripts]
tala = "cli.main:main"
tala-tui = "cli.tui:main"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["cli", "harness", "inference", "astrology"]

[tool.pytest.ini_options]
testpaths = ["tests", "sdk/agent/tests"]
markers = [
    "llm: drives a real model or the running harness — minutes per test, and the result depends on machine state. Deselected by default; run with `pytest -m llm`.",
    "slow: walks the whole tree rather than one component — tens of seconds, but no model and no machine state. Runs by default, because the reachability ratchet is worthless if it is the check people skip.",
]
# The everyday `pytest` is the fast tier, so there is a check cheap enough to
# run after every change. The 11 `llm` tests held essentially the whole 41
# minutes of the old full run, which meant nothing gated a commit and breakage
# surfaced days later.
#
# This deselection is NOT silent: conftest.py prints the deselected count and
# the command to run them at the end of every run.
#
#   pytest            fast tier, the everyday gate
#   pytest -m llm     the live-model tests only
#   pytest -m ""      everything (CI, and any baseline comparison)
addopts = '-m "not llm"'
